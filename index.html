<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TFTZ | Links</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0b0b;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .wrapper {
            width: 100%;
            max-width: 480px;
        }

        /* ستايل الهيدر زي موقع أبو حمزة: صورة على اليمين وجنبها الاسم والبيو */
        .profile-header {
            display: flex;
            align-items: center;
            gap: 16px;
            background: #141414;
            border: 1px solid #222222;
            border-radius: 18px;
            padding: 18px;
            margin-bottom: 20px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }

        .avatar {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: 2px solid #d4af37;
            object-fit: cover;
            flex-shrink: 0;
            background: #000;
        }

        .profile-info h1 {
            font-size: 20px;
            color: #d4af37;
            margin-bottom: 4px;
            font-weight: 700;
        }

        .profile-info p {
            font-size: 13px;
            color: #9ca3af;
        }

        /* قائمة الأزرار شبه موقع أبو حمزة تماماً */
        .links-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .link-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #141414;
            color: #ffffff;
            text-decoration: none;
            padding: 16px 20px;
            border-radius: 14px;
            border: 1px solid #222222;
            transition: all 0.2s ease;
        }

        .link-card:hover {
            background: #1f1f1f;
            border-color: #d4af37;
            transform: translateY(-2px);
        }

        .link-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .link-icon {
            font-size: 20px;
        }

        .link-title {
            font-size: 15px;
            font-weight: 600;
            color: #ffffff;
        }

        .link-desc {
            font-size: 13px;
            color: #71717a;
        }

        /* زر مميز للبث */
        .link-card.live {
            border-color: #00995c;
            background: rgba(0, 153, 92, 0.05);
        }
        .link-card.live:hover {
            background: rgba(0, 153, 92, 0.15);
            border-color: #00cc7a;
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            font-size: 11px;
            color: #52525b;
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <!-- الهيدر (صورة واسم جمب بعض زي أبو حمزة) -->
        <div class="profile-header">
            <img src="myphoto.png" alt="TFTZ" class="avatar">
            <div class="profile-info">
                <h1>TFTZ</h1>
                <p>صانع محتوى وجيمر | PUBG Mobile & GTA V</p>
            </div>
        </div>

        <!-- الأزرار -->
        <div class="links-list">
            <a href="https://kick.com/tftz" class="link-card live" target="_blank">
                <div class="link-right">
                    <span class="link-icon">🔴</span>
                    <span class="link-title">Kick Live</span>
                </div>
                <span class="link-desc">تابع البث المباشر</span>
            </a>

            <a href="https://www.youtube.com/@TFTZMo3az" class="link-card" target="_blank">
                <div class="link-right">
                    <span class="link-icon">▶</span>
                    <span class="link-title">YouTube</span>
                </div>
                <span class="link-desc">قناة اليوتيوب</span>
            </a>

            <a href="https://www.tiktok.com/@tftzmoaz" class="link-card" target="_blank">
                <div class="link-right">
                    <span class="link-icon">🎵</span>
                    <span class="link-title">TikTok</span>
                </div>
                <span class="link-desc">حساب التيك توك</span>
            </a>

            <a href="https://www.instagram.com/tftzmoaaz/" class="link-card" target="_blank">
                <div class="link-right">
                    <span class="link-icon">📸</span>
                    <span class="link-title">Instagram</span>
                </div>
                <span class="link-desc">انستجرام</span>
            </a>

            <a href="https://youtube.com/shorts/4wrOf9AtXrM?si=CvDvROutuWDH2m0_" class="link-card" target="_blank">
                <div class="link-right">
                    <span class="link-icon">🔥</span>
                    <span class="link-title">Latest Video</span>
                </div>
                <span class="link-desc">أحدث فيديو</span>
            </a>
        </div>

        <div class="footer">
            TFTZ Official © 2026
        </div>
    </div>

</body>
</html>
