<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TFTZ | Link-in-Bio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0f10;
            color: #ffffff;
            display: flex;
            justify-content: center;
            padding: 30px 15px;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* الهيدر المتطابق مع أبو حمزة */
        .brand-header {
            background: #111816;
            border: 1px solid #1f2d29;
            border-radius: 20px;
            padding: 24px 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        .brand-avatar {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            border: 2px solid #d4af37;
            object-fit: cover;
            margin-bottom: 12px;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.3);
        }

        .brand-header h1 {
            font-size: 24px;
            color: #d4af37;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .brand-header p {
            font-size: 13px;
            color: #9ca3af;
        }

        /* بوكس حالة البث (Live Status) */
        .live-box {
            background: #111816;
            border: 1px solid #00995c;
            border-radius: 16px;
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .live-info span {
            display: block;
            font-size: 14px;
            font-weight: bold;
            color: #00cc7a;
        }

        .live-info small {
            font-size: 12px;
            color: #6b7280;
        }

        .live-action {
            background: #00995c;
            color: #fff;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            transition: 0.2s;
        }

        .live-action:hover {
            background: #00cc7a;
        }

        /* شبكة الروابط والأزرار */
        .links-stack {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .link-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #111816;
            color: #ffffff;
            text-decoration: none;
            padding: 16px 20px;
            border-radius: 14px;
            border: 1px solid #1f2d29;
            transition: all 0.2s ease;
        }

        .link-card:hover {
            background: #182320;
            border-color: #d4af37;
            transform: translateY(-2px);
        }

        .link-right-side {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 15px;
            font-weight: 600;
        }

        .link-note {
            font-size: 12px;
            color: #6b7280;
        }

        /* قسم الفيديوهات تماماً مثل موقع أبو حمزة */
        .section-label {
            color: #d4af37;
            font-size: 14px;
            font-weight: 700;
            margin-top: 8px;
            padding-right: 6px;
            border-right: 3px solid #d4af37;
        }

        .videos-wrapper {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .video-box {
            background: #111816;
            border: 1px solid #1f2d29;
            border-radius: 14px;
            overflow: hidden;
            text-decoration: none;
            color: #fff;
            transition: 0.2s;
        }

        .video-box:hover {
            border-color: #d4af37;
        }

        .video-img {
            width: 100%;
            height: 100px;
            object-fit: cover;
            background: #000;
        }

        .video-name {
            padding: 10px;
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #d1d5db;
        }

        .site-footer {
            text-align: center;
            margin-top: 20px;
            font-size: 11px;
            color: #4b5563;
        }
    </style>
</head>
<body>

    <div class="container">

        <div class="brand-header">
            <img src="myphoto.png" alt="TFTZ" class="brand-avatar">
            <h1>TFTZ</h1>
            <p>صانع محتوى وجيمر | PUBG Mobile & GTA V</p>
        </div>

        <div class="live-box">
            <div class="live-info">
                <span>🔴 البث المباشر يعمل الآن</span>
                <small>Kick Live Status</small>
            </div>
            <a href="https://kick.com/tftz" class="live-action" target="_blank">شاهد البث</a>
        </div>

        <div class="links-stack">
            <a href="https://www.youtube.com/@TFTZMo3az" class="link-card" target="_blank">
                <div class="link-right-side">
                    <span>▶</span> يوتيوب (YouTube)
                </div>
                <span class="link-note">اشترك بالقناة</span>
            </a>

            <a href="https://www.tiktok.com/@tftzmoaz" class="link-card" target="_blank">
                <div class="link-right-side">
                    <span>🎵</span> تيك توك (TikTok)
                </div>
                <span class="link-note">المقاطع القصيرة</span>
            </a>

            <a href="https://www.instagram.com/tftzmoaaz/" class="link-card" target="_blank">
                <div class="link-right-side">
                    <span>📸</span> انستجرام (Instagram)
                </div>
                <span class="link-note">اليوميات</span>
            </a>
        </div>

        <div class="section-label">أحدث الفيديوهات 🎬</div>
        <div class="videos-wrapper">
            <a href="https://youtube.com/shorts/4wrOf9AtXrM?si=CvDvROutuWDH2m0_" class="video-box" target="_blank">
                <img src="myphoto.png" alt="Video" class="video-img">
                <div class="video-name">أقوى لقطات ببجي موبايل</div>
            </a>
            <a href="https://www.youtube.com/@TFTZMo3az" class="video-box" target="_blank">
                <img src="myphoto.png" alt="Video" class="video-img">
                <div class="video-name">تحدي جديد في GTA V</div>
            </a>
        </div>

        <div class="site-footer">
            TFTZ Official © 2026
        </div>

    </div>

</body>
</html>
