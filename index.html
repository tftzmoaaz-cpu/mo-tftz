<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TFTZ | الصفحة الشخصية</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0b0b;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            padding: 30px 15px;
        }

        .container {
            width: 100%;
            max-width: 460px;
            text-align: center;
        }

        .profile-card {
            background: #121212;
            border: 2px solid #d4af37;
            border-radius: 24px;
            padding: 35px 25px;
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.15);
        }

        .avatar-container {
            position: relative;
            width: 120px;
            height: 120px;
            margin: 0 auto 20px auto;
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 3px solid #d4af37;
            object-fit: cover;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.4);
            background-color: #1a1a1a;
        }

        h1 {
            font-size: 28px;
            color: #d4af37;
            margin-bottom: 6px;
            letter-spacing: 1.5px;
        }

        p.bio {
            color: #aaaaaa;
            font-size: 14px;
            margin-bottom: 30px;
            font-weight: 500;
        }

        .section-title {
            color: #d4af37;
            font-size: 15px;
            margin: 25px 0 12px 0;
            text-align: right;
            padding-right: 5px;
            border-right: 3px solid #d4af37;
        }

        .links-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn-link {
            display: flex;
            align-items: center;
            justify-content: center;
            background: #1a1a1a;
            color: #ffffff;
            text-decoration: none;
            padding: 14px 20px;
            border-radius: 12px;
            border: 1px solid #2a2a2a;
            font-weight: bold;
            font-size: 15px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }

        .btn-link:hover {
            background: #d4af37;
            color: #0b0b0b;
            border-color: #d4af37;
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.35);
        }

        .btn-live {
            background: #00995c !important;
            border-color: #00995c !important;
        }

        .btn-live:hover {
            background: #00cc7a !important;
            color: #0b0b0b !important;
        }

        footer {
            margin-top: 30px;
            font-size: 12px;
            color: #555555;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="profile-card">
            <!-- الصورة الشخصية -->
            <div class="avatar-container">
                <img src="myphoto.png" alt="TFTZ Logo" class="avatar">
            </div>
            
            <h1>TFTZ</h1>
            <p class="bio">صانع محتوى وجيمر | PUBG Mobile & GTA V</p>
            
            <!-- أزرار المنصات الأساسية -->
            <div class="links-list">
                <a href="https://kick.com/tftz" class="btn-link btn-live" target="_blank">🔴 تابع بثوث كيك الحية (Kick)</a>
                <a href="https://www.youtube.com/@TFTZMo3az" class="btn-link" target="_blank">قناة اليوتيوب (YouTube)</a>
                <a href="https://www.tiktok.com/@tftzmoaz" class="btn-link" target="_blank">تيك توك (TikTok)</a>
                <a href="https://www.instagram.com/tftzmoaaz/" class="btn-link" target="_blank">انستجرام (Instagram)</a>
            </div>

            <!-- قسم أحدث المحتويات -->
            <div class="section-title">أحدث الإصدارات 🎬</div>
            <div class="links-list">
                <a href="https://youtube.com/shorts/4wrOf9AtXrM?si=CvDvROutuWDH2m0_" class="btn-link" target="_blank">شاهد آخر فيديو يوتيوب ↗</a>
                <a href="https://www.tiktok.com/@tftzmoaz" class="btn-link" target="_blank">شاهد آخر فيديو تيك توك ↗</a>
                <a href="https://www.instagram.com/tftzmoaaz/" class="btn-link" target="_blank">شاهد آخر منشور انستجرام ↗</a>
            </div>
            
            <footer>
                جميع الحقوق محفوظة © 2026 TFTZ
            </footer>
        </div>
    </div>

</body>
</html>
